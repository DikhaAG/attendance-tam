name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `prisma generate` only writes generated/prisma; it never connects, but
      # prisma.config.ts requires DATABASE_URL to be set.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
      - run: npm run check
